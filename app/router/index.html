<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrintFlow</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "72", Arial, sans-serif;
    background: #f5f6f7;
    margin: 0; padding: 0 0 3rem;
    color: #1d2d3e;
  }
  header {
    background: #354a5f;
    color: #fff;
    padding: 1.6rem 3rem;
    display: flex; align-items: center; gap: .7rem;
  }
  header .logo {
    width: 34px; height: 34px; border-radius: 6px;
    background: #0a6ed1; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 1rem;
  }
  header h1 { margin: 0; font-size: 1.3rem; font-weight: 600; }
  main { max-width: 1100px; margin: 2rem auto 0; padding: 0 2rem; }
  section {
    background: #fff;
    border: 1px solid #e5eaef;
    border-radius: 8px;
    padding: 1.3rem 1.5rem 1.5rem;
    margin-bottom: 1.2rem;
  }
  section h2 {
    font-size: .8rem; text-transform: uppercase; letter-spacing: .06em;
    color: #6a7c8c; margin: 0 0 1rem; font-weight: 600;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: .8rem;
  }
  a.card {
    display: flex; align-items: center; gap: .8rem;
    padding: .9rem 1rem;
    background: #fafbfc;
    border: 1px solid #e5eaef;
    border-left: 3px solid #0a6ed1;
    border-radius: 4px;
    text-decoration: none;
    color: #1d2d3e;
    font-weight: 600;
    font-size: .9rem;
    transition: background .12s ease, box-shadow .12s ease;
  }
  a.card:hover { background: #eef4fb; box-shadow: 0 2px 6px rgba(10,110,209,.12); }
  .badge {
    width: 28px; height: 28px; border-radius: 4px;
    background: #dbe9f8; color: #0a6ed1;
    display: flex; align-items: center; justify-content: center;
    font-size: .8rem; font-weight: 700; flex-shrink: 0;
  }
</style>
</head>
<body>
  <header>
    <div class="logo">PF</div>
    <h1>PrintFlow</h1>
  </header>
  <main>
    <section>
      <h2>Dashboard &amp; Analytics</h2>
      <div class="grid">
        <a class="card" href="printflowdashboard/index.html"><span class="badge">DB</span>Dashboard</a>
        <a class="card" href="printflowanalytics/index.html"><span class="badge">AN</span>Analytics</a>
      </div>
    </section>
    <section>
      <h2>Sales</h2>
      <div class="grid">
        <a class="card" href="printfloworders/index.html"><span class="badge">OR</span>Orders</a>
        <a class="card" href="printflowcustomers/index.html"><span class="badge">CU</span>Customers</a>
        <a class="card" href="printflowproducts/index.html"><span class="badge">PR</span>Products</a>
      </div>
    </section>
    <section>
      <h2>Operations</h2>
      <div class="grid">
        <a class="card" href="printflowproductionboard/index.html"><span class="badge">PB</span>Production Board</a>
        <a class="card" href="printflowproductionorder/index.html"><span class="badge">PO</span>Production Order</a>
        <a class="card" href="printflowmaterials/index.html"><span class="badge">MA</span>Materials</a>
        <a class="card" href="printflowwarehouses/index.html"><span class="badge">WH</span>Warehouses</a>
      </div>
    </section>
    <section>
      <h2>Finance</h2>
      <div class="grid">
        <a class="card" href="printflowpayments/index.html"><span class="badge">PA</span>Payments</a>
        <a class="card" href="printflowdelivery/index.html"><span class="badge">DE</span>Delivery</a>
      </div>
    </section>
  </main>
</body>
</html>
